name: Item variation comparison

# Temporary research workflow; remove before review, retaining the repro commit.
on:
  push:
    branches: [feat/item-affinity-name-variation]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arm: [baseline, affinities, names, both, replicate]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Select the comparison arm
        env:
          ARM: ${{ matrix.arm }}
        run: |
          baseline=c7357f7cc159efc05617d5cf57dee0ada362aaed
          if [[ "$ARM" == baseline || "$ARM" == names ]]; then
            git restore --source="$baseline" -- src/main/java/obtuseloot/artifacts/ArtifactSeedFactory.java src/main/java/obtuseloot/ecology/LocalEcosystem.java src/test/java/obtuseloot/ecology/LocalEcosystemIntegrationTest.java
            rm src/test/java/obtuseloot/artifacts/SeedAffinityInheritanceTest.java
          fi
          if [[ "$ARM" == baseline || "$ARM" == affinities ]]; then
            git restore --source="$baseline" -- src/main/java/obtuseloot/names/NamePoolManager.java src/main/java/obtuseloot/text/ArtifactTextComposer.java src/test/java/obtuseloot/names/ArtifactNamingRefactorTest.java
          fi
          git diff --stat
      - name: Measure actual births
        env:
          ARM: ${{ matrix.arm }}
        run: |
          seed=366385647957
          if [[ "$ARM" == replicate ]]; then seed=366385647958; fi
          mvn -B -ntp test -Dtest=ItemUniquenessMeasurementTest -Dsurefire.failIfNoSpecifiedTests=false -Dobtuseloot.experiments=true -Dobtuseloot.births=3000 -Dobtuseloot.uniquenessSeed="$seed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: item-variation-${{ matrix.arm }}
          path: |
            target/item-uniqueness/
            target/surefire-reports/
          if-no-files-found: error
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B -ntp clean package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: item-variation-suite
          path: target/surefire-reports/
          if-no-files-found: error
