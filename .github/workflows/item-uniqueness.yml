name: Item uniqueness measurement

# One-off measurement (ItemUniquenessMeasurementTest); removed before review.
on:
  push:
    branches: [measure/item-uniqueness]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        births: [3000, 20000]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Measure
        run: >
          mvn -B -ntp test -Dtest='ItemUniquenessMeasurementTest' -Dsurefire.failIfNoSpecifiedTests=false
          -Dobtuseloot.experiments=true -Dobtuseloot.births=${{ matrix.births }}
      - uses: actions/upload-artifact@v4
        with:
          name: item-uniqueness-${{ matrix.births }}
          path: target/item-uniqueness/
          if-no-files-found: error
