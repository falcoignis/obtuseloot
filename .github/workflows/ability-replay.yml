name: Ability replay confirmation

# Temporary research workflow; retain its commit, remove it before PR review.
on:
  push:
    branches: [fix/ability-replay-inputs]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arm: [baseline, affinities, names, both, replicate]
        repeat: [first, second]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Select the comparison arm, retaining controlled identities
        env:
          ARM: ${{ matrix.arm }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          arm = os.environ['ARM']
          if arm in ('baseline', 'names'):
              path = Path('src/main/java/obtuseloot/ecology/LocalEcosystem.java')
              code = path.read_text()
              call = 'new ArtifactSeedFactory().inheritAffinities(child, parent);'
              assert code.count(call) == 1
              fields = ('Precision', 'Brutality', 'Survival', 'Mobility', 'Chaos', 'Consistency')
              copied = '\n            '.join(f'child.setSeed{f}Affinity(parent.getSeed{f}Affinity());' for f in fields)
              path.write_text(code.replace(call, copied))
          PY
          if [[ "$ARM" == baseline || "$ARM" == affinities ]]; then
            git restore --source=c7357f7cc159efc05617d5cf57dee0ada362aaed -- src/main/java/obtuseloot/names/NamePoolManager.java src/main/java/obtuseloot/text/ArtifactTextComposer.java
          fi
          git diff --stat
      - name: Measure actual births
        env:
          ARM: ${{ matrix.arm }}
        run: |
          seed=366385647957
          if [[ "$ARM" == replicate ]]; then seed=366385647958; fi
          mvn -B -ntp test -Dtest=ItemUniquenessMeasurementTest -Dsurefire.failIfNoSpecifiedTests=false -Dobtuseloot.experiments=true -Dobtuseloot.births=3000 -Dobtuseloot.uniquenessSeed="$seed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: item-variation-${{ matrix.arm }}-${{ matrix.repeat }}
          path: |
            target/item-uniqueness/
            target/surefire-reports/
          if-no-files-found: error
  compare:
    needs: measure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: item-variation-*
          path: target/downloads
      - name: Verify every replay and paired-arm neutrality check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('target/replays')
          for source in Path('target/downloads').iterdir():
              name, repeat = source.name.rsplit('-', 1)
              dest = root / repeat / name
              dest.parent.mkdir(parents=True, exist_ok=True)
              source.rename(dest)
          PY
          python3 scripts/summarize-item-variation.py target/replays/first --replay target/replays/second > target/comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ability-replay-comparison
          path: target/comparison.json
          if-no-files-found: error
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B -ntp clean package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ability-replay-suite
          path: |
            target/surefire-reports/
            target/ability-replay/
          if-no-files-found: error
